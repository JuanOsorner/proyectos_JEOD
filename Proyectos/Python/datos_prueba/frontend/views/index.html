<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regresión Lineal Bitcoin</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="background"></div>
    <div class="background-overlay"></div>

    <div class="container">

        <div id="hero">

            <h1>Regresión Lineal Bitcoin</h1>

            <p>
                Obtiene los últimos datos de Bitcoin,
                calcula mínimos cuadrados y visualiza
                la tendencia encontrada.
            </p>

            <button id="load-data-btn">
                Cargar Datos
            </button>

        </div>

        <section id="summary" class="hidden-section">

            

            <h2>Resumen</h2>

            <div id="trend-message">
                Esperando datos...
            </div>

        </section>

        <section id="metrics-section" class="hidden-section">

            <h2>Métricas</h2>

            <div id="metrics-container">

                Esperando datos...

            </div>

        </section>

        <section id="chart-section" class="hidden-section">

            <h2>Gráfica</h2>

            <div class="chart-container">
                <canvas id="bitcoin-chart"></canvas>
            </div>

        </section>

        <section id="table-section" class="hidden-section">

            <h2>Datos</h2>

            <table>

                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Precio USD</th>
                    </tr>
                </thead>

                <tbody id="data-table-body">

                </tbody>

            </table>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
